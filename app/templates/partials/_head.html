{# Fuentes, iconos y estilos. Tailwind, Remix Icon, Inter, Axios y SweetAlert2 llegan por CDN (como el ejemplo del profesor). #}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Tailwind lee los colores de las variables de static/css/app.css (tokens de diseño).
  // `<alpha-value>` permite usar transparencias como bg-accent/30.
  const token = (name) => `rgb(var(--c-${name}) / <alpha-value>)`;

  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas: token('canvas'),
          surface: token('surface'),
          ink: { DEFAULT: token('ink'), soft: token('ink-soft') },
          line: token('line'),
          accent: { DEFAULT: token('accent'), hover: token('accent-hover'), soft: token('accent-soft') },
          sidebar: {
            DEFAULT: token('sidebar'),
            ink: token('sidebar-ink'),
            soft: token('sidebar-soft'),
            line: 'rgb(255 255 255 / 0.09)',
            hover: 'rgb(255 255 255 / 0.06)',
            active: 'rgb(255 255 255 / 0.12)',
          },
          success: { DEFAULT: token('success'), soft: token('success-soft') },
          warning: { DEFAULT: token('warning'), soft: token('warning-soft') },
          danger: { DEFAULT: token('danger'), soft: token('danger-soft') },
          star: token('star'),
        },
        borderRadius: { card: 'var(--radius-card)' },
        boxShadow: { card: 'var(--shadow-card)' },
        fontFamily: {
          sans: ['"Inter Variable"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
